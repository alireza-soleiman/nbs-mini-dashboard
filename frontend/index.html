<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NbS mini-dashboard</title>

  <!-- Leaflet 1.9.4 from a CDN. "integrity" is a fingerprint of the file:
       the browser refuses to use it if the CDN ever serves something else. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
  <header>NbS mini-dashboard · South Tyrol</header>
  <div id="map"></div>

  <!-- Scripts at the end: the #map div already exists when they run -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/map.js"></script>
</body>
</html>
